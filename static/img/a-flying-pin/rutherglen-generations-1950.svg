<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Roboto Condensed, Helvetica Neue, Arial, sans-serif">
  <rect x="0" y="0" width="1600" height="900" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#bbbbbb"/>
  <!-- grid: 0 to 70 rabbits, 10 a line, plot area y 100 to 760 -->
  <g stroke="#dddddd" stroke-width="2">
    <line x1="200" y1="100" x2="1520" y2="100"/>
    <line x1="200" y1="194.3" x2="1520" y2="194.3"/>
    <line x1="200" y1="288.6" x2="1520" y2="288.6"/>
    <line x1="200" y1="382.9" x2="1520" y2="382.9"/>
    <line x1="200" y1="477.1" x2="1520" y2="477.1"/>
    <line x1="200" y1="571.4" x2="1520" y2="571.4"/>
    <line x1="200" y1="665.7" x2="1520" y2="665.7"/>
  </g>
  <!-- axes -->
  <g stroke="#222222" stroke-width="3" fill="none">
    <line x1="200" y1="100" x2="200" y2="760"/>
    <line x1="200" y1="760" x2="1520" y2="760"/>
  </g>
  <!-- y labels -->
  <g font-size="28" fill="#222222" text-anchor="end">
    <text x="180" y="770">0</text>
    <text x="180" y="676">10</text>
    <text x="180" y="581">20</text>
    <text x="180" y="487">30</text>
    <text x="180" y="393">40</text>
    <text x="180" y="299">50</text>
    <text x="180" y="204">60</text>
    <text x="180" y="110">70</text>
  </g>
  <text x="60" y="430" font-size="28" fill="#222222" text-anchor="middle" transform="rotate(-90 60 430)">Rabbits with myxomatosis</text>
  <!-- bars: 66 inoculated, then generations of 35, 16, 12, 8; scale 9.43 px a rabbit -->
  <g>
    <rect x="290" y="137.7" width="180" height="622.3" fill="#8a8a8a"/>
    <rect x="530" y="430" width="180" height="330" fill="#222222"/>
    <rect x="770" y="609.1" width="180" height="150.9" fill="#222222"/>
    <rect x="1010" y="646.9" width="180" height="113.1" fill="#222222"/>
    <rect x="1250" y="684.6" width="180" height="75.4" fill="#222222"/>
  </g>
  <!-- values -->
  <g font-size="34" fill="#222222" text-anchor="middle" font-weight="bold">
    <text x="380" y="125">66</text>
    <text x="620" y="418">35</text>
    <text x="860" y="597">16</text>
    <text x="1100" y="635">12</text>
    <text x="1340" y="672">8</text>
  </g>
  <!-- x labels -->
  <g font-size="26" fill="#222222" text-anchor="middle">
    <text x="380" y="800">Inoculated by hand</text>
    <text x="380" y="834">27 October 1950</text>
    <text x="620" y="800">First generation</text>
    <text x="620" y="834">early November</text>
    <text x="860" y="800">Second</text>
    <text x="860" y="834">mid November</text>
    <text x="1100" y="800">Third</text>
    <text x="1100" y="834">late November</text>
    <text x="1340" y="800">Fourth</text>
    <text x="1340" y="834">early December</text>
  </g>
  <!-- ratios between generations -->
  <g font-size="24" fill="#555555" text-anchor="middle">
    <text x="500" y="380">× 0.53</text>
    <text x="740" y="560">× 0.46</text>
    <text x="980" y="600">× 0.75</text>
    <text x="1220" y="640">× 0.66</text>
  </g>
  <text x="860" y="60" font-size="32" fill="#222222" text-anchor="middle">The second Rutherglen trial, 27 October to 15 December 1950</text>
  <text x="860" y="878" font-size="24" fill="#555555" text-anchor="middle">Each natural generation of the disease was smaller than the one before it. Drawn from the counts in Myers, Journal of Hygiene, 1954.</text>
</svg>
