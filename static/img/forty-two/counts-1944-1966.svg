<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Roboto Condensed, Helvetica Neue, Arial, sans-serif">
  <rect x="0" y="0" width="1600" height="900" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#bbbbbb"/>
  <!-- grid -->
  <g stroke="#dddddd" stroke-width="2">
    <line x1="160" y1="80" x2="1540" y2="80"/>
    <line x1="160" y1="196.7" x2="1540" y2="196.7"/>
    <line x1="160" y1="313.3" x2="1540" y2="313.3"/>
    <line x1="160" y1="430" x2="1540" y2="430"/>
    <line x1="160" y1="546.7" x2="1540" y2="546.7"/>
    <line x1="160" y1="663.3" x2="1540" y2="663.3"/>
    <line x1="536.4" y1="80" x2="536.4" y2="780"/>
    <line x1="850" y1="80" x2="850" y2="780"/>
    <line x1="1163.6" y1="80" x2="1163.6" y2="780"/>
    <line x1="1477.3" y1="80" x2="1477.3" y2="780"/>
  </g>
  <!-- axes -->
  <g stroke="#222222" stroke-width="3" fill="none">
    <line x1="160" y1="80" x2="160" y2="780"/>
    <line x1="160" y1="780" x2="1540" y2="780"/>
  </g>
  <!-- y labels -->
  <g font-size="28" fill="#222222" text-anchor="end">
    <text x="140" y="790">0</text>
    <text x="140" y="673">1,000</text>
    <text x="140" y="557">2,000</text>
    <text x="140" y="440">3,000</text>
    <text x="140" y="323">4,000</text>
    <text x="140" y="207">5,000</text>
    <text x="140" y="90">6,000</text>
  </g>
  <!-- x labels -->
  <g font-size="28" fill="#222222" text-anchor="middle">
    <text x="160" y="820">1944</text>
    <text x="536.4" y="820">1950</text>
    <text x="850" y="820">1955</text>
    <text x="1163.6" y="820">1960</text>
    <text x="1477.3" y="820">1965</text>
  </g>
  <text x="850" y="872" font-size="30" fill="#222222" text-anchor="middle">Reindeer on St. Matthew Island, from the four counts (filled) and three estimates (open)</text>
  <!-- line through the counts -->
  <polyline points="160,776.6 975.5,622.5 1351.9,80 1540,775.1" fill="none" stroke="#222222" stroke-width="4" stroke-linejoin="round"/>
  <!-- estimates -->
  <g fill="#ffffff" stroke="#222222" stroke-width="3">
    <circle cx="787.3" cy="727.5" r="9"/>
    <circle cx="850" cy="692.5" r="9"/>
    <circle cx="1477.3" cy="775.3" r="9"/>
  </g>
  <!-- counts -->
  <g fill="#222222">
    <circle cx="160" cy="776.6" r="11"/>
    <circle cx="975.5" cy="622.5" r="11"/>
    <circle cx="1351.9" cy="80" r="11"/>
    <circle cx="1540" cy="775.1" r="11"/>
  </g>
  <!-- point labels -->
  <g font-size="30" fill="#222222">
    <text x="182" y="740">29 landed, August 1944</text>
    <text x="700" y="760" font-size="26" fill="#555555">400 to 500 seen, 1954</text>
    <text x="760" y="665" font-size="26" fill="#555555">700 to 800 from the air, 1955</text>
    <text x="900" y="590">1,350 counted, 1957</text>
    <text x="1365" y="72" text-anchor="end">6,000 counted, July 1963</text>
    <text x="1260" y="640" font-size="26" fill="#555555">about 40 seen, August 1965</text>
    <text x="1525" y="740" text-anchor="end">42 counted, July 1966</text>
  </g>
</svg>
