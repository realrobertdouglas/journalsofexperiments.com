title: "Journal of Experiments"
description: "Recounts of other people's experiments and the lessons they learned from them."
author: Robert Douglas
github: https://github.com/realrobertdouglas
tagline: "Other people's experiments, and what they taught."

enableTags: true
tagarray: []

# Every file in _posts is an entry; the post layout shows its date and categories.
# _deeper/<entry slug>/<piece>.md is a companion piece that goes deeper on one part of that entry:
# the entry lists its companions under "Go deeper" and each companion links back (layout: deeper.html).
# They are not in the front-page list or the feed; search and the sitemap include them.
collections:
  deeper:
    output: true
    permalink: "/deeper/:path/"

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post, comments: false }
  - scope: { path: "", type: deeper }
    values: { layout: deeper, comments: false }

social: []

share:
  twitter_username:
  fb_appid: ""

url: "https://journalsofexperiments.com"
baseurl: ""

markdown: kramdown

# Files kept in the repo but not published. Setting this replaces Jekyll's own list,
# so its defaults (Gemfile ... vendor, and CNAME from GitHub Pages) are repeated here.
exclude:
  - new-entry.sh
  - README.md
  - AGENTS.md
  - CLAUDE.md
  - CNAME
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

compress_html:
  clippings: all
  comments: ["<!-- ", " -->"]
  endings: all
  ignore:
    envs: ['development']
# UTC matches the GitHub Pages build, so post dates and URLs are the same locally and live
timezone: UTC
