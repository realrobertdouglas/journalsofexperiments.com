# Write back: the Cloudflare Worker that turns a reader's note into a GitHub issue (worker.js; README.md).
name = "journal-write-back"
main = "worker.js"
compatibility_date = "2025-07-18"

[vars]
GITHUB_REPO = "realrobertdouglas/journalsofexperiments.com"
# Pages the worker accepts notes from (the Origin header and the entry's url). Add http://localhost:4000 to test locally.
ALLOWED_ORIGINS = "https://journalsofexperiments.com,https://www.journalsofexperiments.com"

# GITHUB_API = "http://localhost:8787"   # only for a local test against a stand-in; the default is api.github.com

# Secret, set once with `wrangler secret put GITHUB_TOKEN`: a fine-grained GitHub token for this repo with
# Issues: Read and write. Never in this file.
